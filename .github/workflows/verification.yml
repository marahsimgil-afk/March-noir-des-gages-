name: Vérification (synchronisation multi-appareils)

on:
  push:
    branches:
      - main
      - claude/marche-noir-gages-app-dolp68
  workflow_dispatch:
    inputs:
      url:
        description: "URL publique à tester (vide = uniquement le test hors ligne)"
        required: false
        default: ""

jobs:
  hors-ligne:
    name: Scénario complet sur broker local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test de bout en bout (3 navigateurs isolés)
        run: node test/e2e.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captures-hors-ligne
          path: /tmp/mng-*.png
          if-no-files-found: ignore

  brokers-reels:
    name: Scénario complet sur les vrais brokers publics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Trois navigateurs, transport MQTT public réel
        run: node test/e2e.js --reels
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captures-brokers-reels
          path: /tmp/mng-*.png
          if-no-files-found: ignore

  brokers-publics:
    name: Sonde des brokers MQTT publics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node test/sonde-brokers.js
      - name: Candidats supplémentaires (informatif)
        if: always()
        run: node test/sonde-candidats.js

  en-ligne:
    name: Scénario complet sur le site publié
    runs-on: ubuntu-latest
    needs: [hors-ligne]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      # GitHub Pages publie quelques dizaines de secondes après le push, et le
      # CDN peut encore servir la version précédente. On attend que le app.js
      # servi en ligne soit exactement celui de ce commit, empreinte à l'appui :
      # sans quoi on testerait l'ancienne version sans le savoir.
      - name: Attendre que le site serve bien ce commit
        id: attente
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          LOCAL=$(sha256sum app.js | cut -d' ' -f1)
          echo "empreinte attendue : $LOCAL"
          for i in $(seq 1 40); do
            DISTANT=$(curl -s -L --max-time 20 "$BASE/app.js" | sha256sum | cut -d' ' -f1)
            if [ "$DISTANT" = "$LOCAL" ]; then
              echo "Site à jour après $((i * 10)) s — $BASE"
              exit 0
            fi
            sleep 10
          done
          echo "Le site ne sert toujours pas ce commit (dernière empreinte $DISTANT)." >&2
          exit 1

      - name: Trois navigateurs contre le site publié
        env:
          URL_APP: ${{ steps.attente.outputs.base }}
        run: node test/e2e.js --public

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captures-en-ligne
          path: /tmp/mng-*.png
          if-no-files-found: ignore
