name: Mise en ligne (GitHub Pages)

on:
  push:
    branches: ["claude/marche-noir-gages-app-7g78ic"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  activer:
    name: Activer Pages
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.activation.outputs.mode }}
    steps:
      - id: activation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          corps="{\"source\":{\"branch\":\"$BRANCHE\",\"path\":\"/docs\"}}"

          if etat=$(gh api "repos/$REPO/pages" 2>/dev/null); then
            echo "Pages est déjà activé :"
            echo "$etat" | jq '{status, html_url, build_type, source}'
            if [ "$(echo "$etat" | jq -r '.build_type')" = "legacy" ]; then
              echo "$corps" | gh api -X PUT "repos/$REPO/pages" --input - && echo "source mise à jour"
              echo "mode=legacy" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "mode=workflow" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "Pages n'est pas activé — tentative avec la branche $BRANCHE (dossier /docs)"
          if echo "$corps" | gh api -X POST "repos/$REPO/pages" --input -; then
            echo "mode=legacy" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "Refusé — bascule sur une publication par workflow"
          echo '{"build_type":"workflow"}' | gh api -X POST "repos/$REPO/pages" --input - || true
          echo "mode=workflow" >> "$GITHUB_OUTPUT"

  deployer:
    name: Publier l'artefact
    needs: activer
    if: needs.activer.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploiement
        uses: actions/deploy-pages@v4

  verifier:
    name: Vérifier la mise en ligne
    needs: [activer, deployer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 40); do
            j=$(gh api "repos/$REPO/pages" 2>/dev/null || echo '{}')
            s=$(echo "$j" | jq -r '.status // "absent"')
            u=$(echo "$j" | jq -r '.html_url // ""')
            echo "tentative $i — statut : $s"
            if [ "$s" = "built" ]; then
              code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$u")
              echo "HTTP $code sur $u"
              head -c 200 /tmp/page.html
              {
                echo "## L'application est en ligne"
                echo ""
                echo "**$u**"
                echo ""
                echo "Réponse HTTP : $code"
              } >> "$GITHUB_STEP_SUMMARY"
              [ "$code" = "200" ] && exit 0
            fi
            sleep 15
          done
          echo "::error::Pages n'a pas fini de se construire"
          gh api "repos/$REPO/pages" || true
          exit 1
