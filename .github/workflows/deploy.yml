name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/marche-noir-gages-app-ymno7k, main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement` active GitHub Pages sur le dépôt s'il ne l'est pas encore,
      # ce qui évite un passage manuel dans les réglages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Adresse publique
        run: echo "En ligne sur ${{ steps.deploiement.outputs.page_url }}"
