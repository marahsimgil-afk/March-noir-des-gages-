name: Mise en ligne et vérification réelle

on:
  push:
    branches: ["claude/marche-noir-gages-app-7g78ic"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  en_ligne:
    name: Publier puis vérifier sur plusieurs appareils
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Le fichier autonome est à jour
        run: |
          npm run build
          git diff --exit-code docs/solo.html \
            || { echo "::error::docs/solo.html ne correspond plus aux sources — lancer 'npm run build'"; exit 1; }

      - name: GitHub Pages, si le dépôt l'autorise
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          corps="{\"source\":{\"branch\":\"$BRANCHE\",\"path\":\"/docs\"}}"
          if ! gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            if ! echo "$corps" | gh api -X POST "repos/$REPO/pages" --input - >/dev/null 2>&1; then
              echo "::warning::Pages n'est pas activé et le jeton d'Actions n'a pas le droit de l'activer (droit Administration requis). À faire une fois dans Settings → Pages → Source : cette branche, dossier /docs."
              exit 0
            fi
          fi
          echo "$corps" | gh api -X PUT "repos/$REPO/pages" --input - >/dev/null 2>&1 || true
          gh api -X POST "repos/$REPO/pages/builds" >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            u=$(gh api "repos/$REPO/pages" --jq 'select(.status=="built") | .html_url' 2>/dev/null || echo '')
            [ -n "$u" ] && { echo "url=$u" >> "$GITHUB_OUTPUT"; echo "Pages : $u"; exit 0; }
            sleep 10
          done
          echo "Pages ne s'est pas construit à temps"

      - name: Choisir une URL publique qui démarre vraiment
        id: url
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PAGES: ${{ steps.pages.outputs.url }}
        run: |
          base=$(node tools/choisir-url.mjs \
            ${PAGES:+"$PAGES"} \
            ${PAGES:+"${PAGES}solo.html"} \
            "https://cdn.statically.io/gh/$REPO/$SHA/docs/solo.html" \
            "https://cdn.statically.io/gh/$REPO/$SHA/docs/index.html" \
            "https://rawcdn.githack.com/$REPO/$SHA/docs/solo.html")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          { echo "## L'application est en ligne"; echo ""; echo "**$base**"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Test multi-appareils sur l'application en ligne
        env:
          BASE: ${{ steps.url.outputs.base }}
          BROKER: ""
        run: node test/e2e.mjs
