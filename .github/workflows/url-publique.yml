name: URL publique (CDN GitHub) + vérification en ligne

# GitHub Pages demande une activation manuelle que le jeton d'Actions n'a pas le
# droit de faire. En attendant, un dépôt public est servi tel quel par plusieurs
# CDN. Ce workflow cherche lequel renvoie bien du HTML, puis rejoue le scénario
# complet à trois navigateurs contre cette adresse réelle.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit (SHA) ou branche à publier"
        required: false
        default: ""

jobs:
  choisir-et-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identifier le commit
        id: sha
        run: |
          SHA="${{ inputs.ref }}"
          [ -z "$SHA" ] && SHA="$GITHUB_SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Commit publié : $SHA"

      - name: Sonder les CDN
        id: cdn
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          DEPOT="${{ github.repository }}"
          CANDIDATS="
          https://cdn.jsdelivr.net/gh/${DEPOT}@${SHA}
          https://rawcdn.githack.com/${DEPOT}/${SHA}
          https://cdn.statically.io/gh/${DEPOT}/${SHA}
          "
          GAGNANT=""
          for BASE in $CANDIDATS; do
            [ -z "$BASE" ] && continue
            echo "--- $BASE/index.html"
            CODE=$(curl -s -o /tmp/page.html -w '%{http_code}' -L --max-time 25 "$BASE/index.html" || echo 000)
            TYPE=$(curl -s -o /dev/null -D - -L --max-time 25 "$BASE/index.html" 2>/dev/null | grep -i '^content-type:' | tail -1 | tr -d '\r' || true)
            echo "    code=$CODE  $TYPE"
            if [ "$CODE" = "200" ] && echo "$TYPE" | grep -qi 'text/html'; then
              # Les fichiers voisins doivent suivre, sinon l'app ne démarre pas.
              JS=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$BASE/app.js" || echo 000)
              MQ=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 40 "$BASE/vendor/mqtt.min.js" || echo 000)
              CSS=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$BASE/style.css" || echo 000)
              echo "    app.js=$JS  mqtt=$MQ  style=$CSS"
              if [ "$JS" = "200" ] && [ "$MQ" = "200" ] && [ "$CSS" = "200" ]; then
                echo "    ✓ retenu"
                [ -z "$GAGNANT" ] && GAGNANT="$BASE"
              fi
            fi
          done
          if [ -z "$GAGNANT" ]; then
            echo "Aucun CDN ne sert l'application correctement." >&2
            exit 1
          fi
          echo "base=$GAGNANT" >> "$GITHUB_OUTPUT"
          echo "## Adresse publique" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$GAGNANT/index.html\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Scénario complet contre l'adresse publique
        env:
          URL_APP: ${{ steps.cdn.outputs.base }}
        run: node test/e2e.js --public

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captures-en-ligne
          path: /tmp/mng-*.png
          if-no-files-found: ignore
