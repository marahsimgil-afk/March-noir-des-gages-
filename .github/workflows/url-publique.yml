name: URL publique (CDN GitHub) + vérification en ligne

# GitHub Pages demande une activation manuelle que le jeton d'Actions n'a pas le
# droit de faire. En attendant, on cherche un CDN qui accepte de servir un dépôt
# public tel quel — en exigeant qu'il rende vraiment notre page (certains
# intercalent une page d'avertissement, d'autres forcent text/plain) — puis on
# rejoue le scénario complet à trois navigateurs contre cette adresse réelle.

on:
  push:
    branches:
      - main
      - claude/marche-noir-gages-app-dolp68
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit (SHA) ou branche à publier"
        required: false
        default: ""

jobs:
  choisir-et-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identifier le commit
        id: sha
        run: |
          SHA="${{ inputs.ref }}"
          [ -z "$SHA" ] && SHA="$GITHUB_SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Commit publié : $SHA"

      - name: Sonder les CDN
        id: cdn
        run: |
          set -u
          SHA="${{ steps.sha.outputs.sha }}"
          DEPOT="${{ github.repository }}"
          CANDIDATS="
          https://cdn.statically.io/gh/${DEPOT}/${SHA}
          https://cdn.jsdelivr.net/gh/${DEPOT}@${SHA}
          https://rawcdn.githack.com/${DEPOT}/${SHA}
          https://raw.githack.com/${DEPOT}/${SHA}
          "
          GAGNANT=""
          for BASE in $CANDIDATS; do
            [ -z "$BASE" ] && continue
            echo "=== $BASE"
            ENTETES=$(curl -s -o /tmp/page.html -D /tmp/entetes.txt -w '%{http_code}' -L --max-time 30 "$BASE/index.html" || echo 000)
            TYPE=$(grep -i '^content-type:' /tmp/entetes.txt | tail -1 | tr -d '\r' || true)
            echo "    index.html : code=$ENTETES  $TYPE"

            if [ "$ENTETES" != "200" ]; then echo "    ✗ page absente"; continue; fi
            if ! echo "$TYPE" | grep -qi 'text/html'; then echo "    ✗ servi hors text/html (le navigateur ne l'exécutera pas)"; continue; fi
            # Certains proxys renvoient bien du text/html… mais leur propre page
            # d'avertissement. On exige donc des marqueurs de NOTRE page.
            if ! grep -q 'id="app"' /tmp/page.html || ! grep -q 'app.js' /tmp/page.html; then
              echo "    ✗ ce n'est pas notre page (page intermédiaire du service)"
              head -c 300 /tmp/page.html | tr '\n' ' '
              echo
              continue
            fi

            OK=1
            for F in app.js style.css vendor/qrcode.js vendor/mqtt.min.js; do
              C=$(curl -s -o /tmp/f -D /tmp/h -w '%{http_code}' -L --max-time 60 "$BASE/$F" || echo 000)
              T=$(grep -i '^content-type:' /tmp/h | tail -1 | tr -d '\r' || true)
              NOSNIFF=$(grep -ic 'x-content-type-options: *nosniff' /tmp/h || true)
              echo "    $F : code=$C  $T  nosniff=$NOSNIFF"
              [ "$C" = "200" ] || OK=0
              case "$F" in
                *.js)
                  # Un .js servi en text/plain avec nosniff est refusé par le navigateur.
                  if [ "$NOSNIFF" != "0" ] && ! echo "$T" | grep -qiE 'javascript|ecmascript'; then OK=0; fi
                  ;;
              esac
            done

            if [ "$OK" = "1" ]; then
              echo "    ✓ retenu"
              GAGNANT="$BASE"
              break
            fi
            echo "    ✗ ressources incomplètes ou mal typées"
          done

          if [ -z "$GAGNANT" ]; then
            {
              echo "### Aucun CDN utilisable"
              echo ""
              echo "Aucun service ne sert l'application de façon exploitable par un navigateur."
              echo "Il faut activer **Settings → Pages → Source : GitHub Actions**, puis relancer"
              echo "le workflow « Déploiement (GitHub Pages) »."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Aucun CDN ne sert l'application correctement." >&2
            exit 1
          fi
          echo "base=$GAGNANT" >> "$GITHUB_OUTPUT"
          {
            echo "## Adresse publique"
            echo ""
            echo "\`$GAGNANT/index.html\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Scénario complet contre l'adresse publique
        env:
          URL_APP: ${{ steps.cdn.outputs.base }}
        run: node test/e2e.js --public

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captures-en-ligne
          path: /tmp/mng-*.png
          if-no-files-found: ignore
