name: Mise en ligne et vérification réelle

# Le bac à sable de développement n'a d'accès réseau que vers GitHub : il ne peut
# joindre ni une URL publique ni les brokers MQTT. C'est donc ce workflow, exécuté
# sur un runner GitHub à l'accès Internet normal, qui met en ligne puis vérifie
# réellement la synchronisation multi-appareils.
#
# Deux questions distinctes, traitées séparément :
#   1. quelle adresse publique affiche réellement l'application ?
#   2. la synchronisation fonctionne-t-elle sur les vrais brokers publics ?
# La seconde est vérifiée dans tous les cas — au besoin en servant le site
# localement sur le runner, le transport temps réel restant, lui, bien réel.

on:
  push:
    branches: [claude/marche-noir-gages-app-ymno7k, main]
  workflow_dispatch:
  schedule:
    # Contrôle hebdomadaire : si un broker public tombe d'ici la soirée, l'échec
    # du job le signalera avant le jour J plutôt que le soir même.
    - cron: '17 9 * * 1'

permissions:
  contents: write

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  en-ligne:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publication du site sur la branche gh-pages : c'est la source que GitHub
      # Pages servira dès qu'il sera activé sur le dépôt.
      - name: Publier la branche gh-pages
        run: |
          set -eux
          cp -r public /tmp/site
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      - name: Tests unitaires des règles
        run: |
          set -o pipefail
          node tests/unit-game.js | tee /tmp/unit.txt

      - name: État des brokers MQTT publics
        run: |
          set -o pipefail
          node tests/check-brokers.js | tee /tmp/brokers.txt

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Quelle adresse publique affiche l'application ?
        id: adresse
        run: |
          set -o pipefail
          node tests/sonde-urls.js \
            "https://marahsimgil-afk.github.io/March-noir-des-gages-" \
            "https://cdn.statically.io/gh/marahsimgil-afk/March-noir-des-gages-/gh-pages" \
            "https://raw.githack.com/marahsimgil-afk/March-noir-des-gages-/gh-pages" \
            "https://rawcdn.githack.com/marahsimgil-afk/March-noir-des-gages-/gh-pages" \
            "https://htmlpreview.github.io/?https://raw.githubusercontent.com/marahsimgil-afk/March-noir-des-gages-/gh-pages" \
            | tee /tmp/sonde.txt
          url="$(grep '^RETENUE=' /tmp/sonde.txt | cut -d= -f2-)"
          if [ -n "$url" ]; then
            echo "base=$url" >> "$GITHUB_OUTPUT"
            echo "publique=oui" >> "$GITHUB_OUTPUT"
          else
            # Repli : le site est servi par le runner, mais la synchronisation
            # passe quand même par les vrais brokers publics — c'est le maillon
            # qui compte et il reste testé pour de bon.
            echo "base=http://localhost:8080" >> "$GITHUB_OUTPUT"
            echo "publique=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Suite multi-appareils sur les vrais brokers
        env:
          MNG_BASE: ${{ steps.adresse.outputs.base }}
          MNG_WS: ''
        run: npx playwright test --reporter=list

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "## Adresse publique"
            echo ""
            if [ "${{ steps.adresse.outputs.publique }}" = "oui" ]; then
              echo "\`${{ steps.adresse.outputs.base }}/index.html\`"
            else
              echo "**Aucune adresse publique ne sert encore l'application.**"
              echo "Activer GitHub Pages sur le dépôt (Settings → Pages → branche \`gh-pages\`)"
              echo "suffit : la branche est déjà publiée et tenue à jour par ce workflow."
              echo ""
              echo "La synchronisation a malgré tout été vérifiée sur les vrais brokers"
              echo "publics, le site étant servi localement par le runner."
            fi
            echo ""
            echo "## Brokers MQTT publics"
            echo '```'
            cat /tmp/brokers.txt 2>/dev/null || true
            echo '```'
            echo "## Adresses sondées"
            echo '```'
            cat /tmp/sonde.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-playwright
          path: test-results/
          retention-days: 7
